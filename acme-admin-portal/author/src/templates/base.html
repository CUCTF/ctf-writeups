<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ACME Internal Admin Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-mark">▣</span>
      <span class="logo-text">ACME <span class="logo-sub">Technologies</span></span>
    </div>
    <div class="topbar-right">
      <span class="status-dot online"></span>
      <span class="status-label">Systems Nominal</span>
      <span class="divider">|</span>
      <span class="env-badge">INTERNAL</span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-section">
        <span class="sidebar-label">NAVIGATION</span>
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
          <span class="nav-icon">⬛</span> Dashboard
        </a>
        <a href="/tools" class="nav-link {% if request.path == '/tools' %}active{% endif %}">
          <span class="nav-icon">⬛</span> Network Tools
        </a>
        <a href="/logs" class="nav-link {% if request.path == '/logs' %}active{% endif %}">
          <span class="nav-icon">⬛</span> System Logs
        </a>
        <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">
          <span class="nav-icon">⬛</span> About
        </a>
      </div>
      <div class="sidebar-footer">
        <span class="sidebar-label">SESSION</span>
        <div class="session-info">admin@acme-tech</div>
        <div class="session-info muted">Portal v2.4.1</div>
      </div>
    </nav>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <footer class="footer">
    <span>© 2024 ACME Technologies — Internal Use Only</span>
    <span class="footer-right">⚠ AUTHORIZED PERSONNEL ONLY</span>
  </footer>

</body>
</html>
